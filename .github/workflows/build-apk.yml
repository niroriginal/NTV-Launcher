
name: Extract Android Project into Repository

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find uploaded ZIP
        id: findzip
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 3 -type f \
            -iname '*.zip' \
            -not -path './.git/*' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::No ZIP file found in repository."
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project
        shell: bash
        env:
          ZIP_FILE: ${{ steps.findzip.outputs.zip_file }}
        run: |
          mkdir -p /tmp/launcher-project
          unzip -o "$ZIP_FILE" -d /tmp/launcher-project

          SETTINGS="$(find /tmp/launcher-project \
            -type f \( -name settings.gradle \
            -o -name settings.gradle.kts \) | head -n 1)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::No settings.gradle found inside ZIP."
            find /tmp/launcher-project -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "Project directory: $PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::No app folder found beside settings.gradle."
            exit 1
          fi

          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='*.zip' \
            "$PROJECT_DIR/" ./

          echo "Extracted project files:"
          find . -maxdepth 5 -type f \
            -not -path './.git/*' | head -200

      - name: Commit extracted files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A \
            app \
            settings.gradle \
            settings.gradle.kts \
            build.gradle \
            build.gradle.kts \
            gradle.properties \
            gradlew \
            gradle \
            README.md

          if git diff --cached --quiet; then
            echo "No new project files to commit."
          else
            git commit -m "Extract Android launcher project"
            git push
          fi

