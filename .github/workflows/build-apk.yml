
name: Build DNA TV Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Find and extract launcher ZIP
        run: |
          ZIP_FILE="DNA_Cinematic_TV_Launcher_Phone_Build.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Launcher ZIP not found: $ZIP_FILE"
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          mkdir -p buildsrc
          unzip -o "$ZIP_FILE" -d buildsrc

          echo "Extracted project files:"
          ls -la buildsrc

      - name: Verify Android project
        run: |
          if [ ! -f buildsrc/settings.gradle ] && \
             [ ! -f buildsrc/settings.gradle.kts ]; then
            echo "ERROR: settings.gradle not found at ZIP root."
            echo "Checking extracted folders:"
            find buildsrc -maxdepth 4 -type f | head -100
            exit 1
          fi

          if [ ! -f buildsrc/app/build.gradle ] && \
             [ ! -f buildsrc/app/build.gradle.kts ]; then
            echo "ERROR: App Gradle file not found."
            find buildsrc -maxdepth 4 -type f
            exit 1
          fi

      - name: Build debug APK
        working-directory: buildsrc
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DNA-TV-Launcher-APK
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
